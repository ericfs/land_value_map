---
- name: Process Land Value and Generate Map Tiles
  hosts: localhost
  vars_files:
    - "config.yml"
    - "{{ env }}.yml"

  tasks:
    - name: Create build_dir folder.
      ansible.builtin.file:
        path: "{{ build_dir }}"
        state: directory
        mode: 0755

    - name: Convert GDB to GeoParquet (cached)
      ansible.builtin.command:
        argv:
          - "python3"
          - "{{ working_dir }}/src/gdb_to_parquet.py"
          - "--gdb={{ statewide_gdb }}"
          - "--output={{ statewide_parquet }}"
        chdir: "{{ working_dir }}"
        creates: "{{ statewide_parquet }}"

    - name: Generate GeoJSON
      ansible.builtin.command:
        argv:
          - "python3"
          - "{{ working_dir }}/src/main.py"
          - "--output_dir={{ build_dir }}"
          - "--parquet={{ statewide_parquet }}"
          - "--cama_dir={{ cama_dir }}"
        chdir: "{{ working_dir }}"

    - name: Check if map tiles already exist
      ansible.builtin.stat:
        path: "{{ tiles_dir }}/metadata.json"
      register: tiles_status

    - name: Create tiles output directory
      ansible.builtin.file:
        path: "{{ tiles_dir }}"
        state: directory
        mode: 0755
      when: not tiles_status.stat.exists

    - name: Generate Map Tiles
      ansible.builtin.command:
        argv:
          - "bash"
          - "{{ working_dir }}/tippecanoe/gen_tiles.sh"
        chdir: "{{ working_dir }}"
      environment:
        GEOJSON_DIR: "{{ geojson_dir }}"
        TILES_DIR: "{{ tiles_dir }}"
      when: not tiles_status.stat.exists

    - name: Gzip tile files for static serving
      ansible.builtin.shell: gzip -fk9 "{{ tiles_dir }}"/*/*/*.pbf
      when: gzip_tiles | default(true)

    - name: Remove stale gzipped tiles from build dir
      ansible.builtin.shell: find "{{ tiles_dir }}" -name '*.pbf.gz' -delete
      when: not (gzip_tiles | default(true))

    - name: Fill tile.json
      ansible.builtin.command:
        chdir: "{{ working_dir }}"
        argv:
          - "python3"
          - "{{ working_dir }}/src/merge_tilejson.py"
          - "--tilejson={{ working_dir }}/templates/tile.json"
          - "--metadata={{ build_dir }}/tiles/metadata.json"
          - "--output={{ build_dir }}/tile.json"
          - "--scheme={{ scheme }}"
          - "--hostname={{ hostname }}"
          - "--version={{ version }}"

- name: Deploy static map site
  hosts: localhost
  vars_files:
    - "config.yml"
    - "{{ env }}.yml"

  tasks:
    - name: Create deployment folder.
      ansible.builtin.file:
        path: "{{ deploy_dir }}/static/{{ version }}/tiles"
        state: directory
        mode: 0755

    - name: Sync Deployment directory
      ansible.posix.synchronize:
        src: "{{ working_dir }}/serving/"
        dest: "{{ deploy_dir }}"
        delete: false
        recursive: true
        perms: false

    - name: Sync generated tiles directory
      ansible.posix.synchronize:
        src: "{{ build_dir }}/tiles/"
        dest: "{{ deploy_dir }}/static/{{ version }}/tiles"
        delete: false
        recursive: true
        perms: false

    - name: Sync generated tile.json
      ansible.posix.synchronize:
        src: "{{ build_dir }}/tile.json"
        dest: "{{ deploy_dir }}/static/{{ version }}"
        delete: false
        recursive: true
        perms: false

    - name: Fill static HTML templates
      ansible.builtin.template:
        src: "{{ working_dir }}/templates/index.html.j2"
        dest: "{{ deploy_dir }}/static/index.html"
      notify: reload nginx

    - name: Copy nginx config for serving
      ansible.builtin.copy:
        src: "{{ deploy_dir }}/nginx/nginx.conf"
        dest: "/etc/nginx/nginx.conf"
        remote_src: true
      notify: reload nginx

    - name: Symlink static content to nginx html directory
      ansible.builtin.file:
        src: "{{ deploy_dir }}/static"
        dest: "/usr/share/nginx/html"
        state: link
        force: true
      notify: reload nginx

    - name: Start nginx to serve the map
      ansible.builtin.shell: pgrep nginx || nginx
      changed_when: false

  handlers:
    - name: reload nginx
      ansible.builtin.command: nginx -s reload
